<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password | Mausam</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <aside class="sidebar">
        <div class="brand"><div class="brand-logo"><img src="assets/mausam-logo.png" alt="MAUSAM"></div><span>MAUSAM</span></div>
        <nav class="navigation">
            <a href="dashboard.html" class="nav-item"><span class="nav-icon">⌂</span><span>Home</span></a>
            <a href="journey.html" class="nav-item"><span class="nav-icon">↗</span><span>Journey</span></a>
            <a href="forecast.html" class="nav-item"><span class="nav-icon">▤</span><span>Forecast</span></a>
            <a href="alerts.html" class="nav-item"><span class="nav-icon">!</span><span>Alerts</span></a>
            <a href="nearby.html" class="nav-item"><span class="nav-icon">⌖</span><span>Nearby</span></a>
            <a href="saved.html" class="nav-item"><span class="nav-icon">☆</span><span>Saved Places</span></a>
        </nav>
        <div class="sidebar-bottom">
            <a href="settings.html" class="nav-item active"><span class="nav-icon">⚙</span><span>Settings</span></a>
            <a href="personalize.html" class="nav-item"><span class="nav-icon">◉</span><span>Personalize</span></a>
            <a href="index.html" class="logout-button"><span class="nav-icon">↪</span><span>Logout</span></a>
        </div>
    </aside>

    <main class="profile-page change-password-page">

        <div class="profile-page-container">

            <!-- CHANGE PASSWORD CARD -->

            <section class="profile-edit-card change-password-card">

                <div class="profile-page-heading">

                    <span>SECURITY</span>

                    <h1>Change Password</h1>

                    <p>
                        Create a new password to keep your Mausam account secure.
                    </p>

                </div>


                <div class="password-security-note">
                    <strong>Password security</strong>
                    <span>Use a unique password with at least 8 characters.</span>
                </div>

                <form id="changePasswordForm">

                    <!-- NEW PASSWORD -->

                    <div class="profile-input-group">

                        <label for="newPassword">
                            New Password
                        </label>

                        <div class="password-input-wrapper">

                            <input
                                type="password"
                                id="newPassword"
                                placeholder="Enter new password"
                                required
                                minlength="8"
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="toggleNewPassword"
                            >
                                Show
                            </button>

                        </div>

                        <p class="password-hint">
                            Use at least 8 characters.
                        </p>

                    </div>


                    <!-- RE-ENTER PASSWORD -->

                    <div class="profile-input-group">

                        <label for="confirmPassword">
                            Re-enter New Password
                        </label>

                        <div class="password-input-wrapper">

                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Re-enter new password"
                                required
                                minlength="8"
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="toggleConfirmPassword"
                            >
                                Show
                            </button>

                        </div>

                        <p
                            class="password-error"
                            id="passwordError"
                        ></p>

                    </div>


                    <!-- SUBMIT -->

                    <button
                        type="submit"
                        class="save-profile-button"
                    >
                        Change Password
                    </button>

                </form>

            </section>

        </div>

    </main>


    <script src="language.js"></script>
    <script>

        const newPassword =
            document.getElementById("newPassword");

        const confirmPassword =
            document.getElementById("confirmPassword");

        const passwordError =
            document.getElementById("passwordError");


        /* =========================
           SHOW / HIDE NEW PASSWORD
           ========================= */

        document
            .getElementById("toggleNewPassword")
            .addEventListener("click", function () {

                if (newPassword.type === "password") {

                    newPassword.type = "text";

                    this.textContent = "Hide";

                } else {

                    newPassword.type = "password";

                    this.textContent = "Show";

                }

            });


        /* =========================
           SHOW / HIDE CONFIRM PASSWORD
           ========================= */

        document
            .getElementById("toggleConfirmPassword")
            .addEventListener("click", function () {

                if (confirmPassword.type === "password") {

                    confirmPassword.type = "text";

                    this.textContent = "Hide";

                } else {

                    confirmPassword.type = "password";

                    this.textContent = "Show";

                }

            });


        /* =========================
           PASSWORD MATCH CHECK
           ========================= */

        confirmPassword.addEventListener("input", function () {

            if (
                confirmPassword.value &&
                newPassword.value !== confirmPassword.value
            ) {

                passwordError.textContent =
                    "Passwords do not match.";

            } else {

                passwordError.textContent = "";

            }

        });


        /* =========================
           SUBMIT
           ========================= */

        document
            .getElementById("changePasswordForm")
            .addEventListener("submit", function (event) {

                event.preventDefault();


                if (
                    newPassword.value !==
                    confirmPassword.value
                ) {

                    passwordError.textContent =
                        "Passwords do not match.";

                    return;

                }


                if (newPassword.value.length < 8) {

                    passwordError.textContent =
                        "Password must contain at least 8 characters.";

                    return;

                }


                alert(window.MausamLanguage.translate("Password changed successfully."));

                window.location.href =
                    "dashboard.html";

            });

    </script>

</body>

</html>
