<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mausam</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="login-logo">
                <img src="assets/mausam-logo.png" alt="MAUSAM">
            </div>

            <h1>Welcome to Mausam</h1>

            <p class="login-subtitle">
                Weather that understands your needs.
            </p>

            <button class="login-button" type="button" onclick="continueToMausam()">
                Continue to Mausam
            </button>

        </section>

    </main>

    <script>
        function continueToMausam() {
            window.location.href = "dashboard.html";
        }
    </script>

</body>
</html>
